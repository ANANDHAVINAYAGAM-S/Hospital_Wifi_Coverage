<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CWMOS — Clinical Wi-Fi Monitoring & Optimization System</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              950: '#06101E',
              900: '#0B1F3A',
              850: '#0F2747',
              800: '#143054',
              700: '#1E3A5F',
              600: '#2A4D7A',
            },
            teal: {
              400: '#00E5FF',
              500: '#00B4D8',
              600: '#0077B6',
            },
            hazard: {
              yellow: '#FFB703',
              red: '#E63946',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0B1F3A;
      color: #E2E8F0;
      font-family: 'Inter', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0B1F3A;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1E3A5F;
      border-radius: 3px;
    }
    .hatch-pattern {
      background: repeating-linear-gradient(
        45deg,
        rgba(230, 57, 70, 0.45),
        rgba(230, 57, 70, 0.45) 4px,
        rgba(255, 183, 3, 0.15) 4px,
        rgba(255, 183, 3, 0.15) 8px
      );
    }
  </style>
</head>
<body class="min-h-screen bg-[#0B1F3A] text-slate-100 flex flex-col selection:bg-teal-500 selection:text-navy-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // --------------------------------------------------------------------------
    // SYSTEM CONSTANTS & LAYOUT DATA (Matches Phase 2 & Phase 3 Specs)
    // --------------------------------------------------------------------------
    const GRID_W = 40; // Downsampled 80m -> 40 cells (2m per cell)
    const GRID_H = 30; // Downsampled 60m -> 30 cells (2m per cell)

    const DEFAULT_CONFIG = {
      rssiThreshold: -75.0, // dBm
      channelOverlapThreshold: 30, // %
      minSamplesGate: 5, // readings
      weightPeakClinical: '07:00-09:00',
      weightShiftChange: '14:00-15:00',
      weightNight: '23:00-05:00',
    };

    const ACCESS_POINTS = [
      { id: "AP-1", x: 10, y: 45, channel: 36, txPower: 20, zone: "Ward A" },
      { id: "AP-2", x: 30, y: 45, channel: 40, txPower: 20, zone: "Ward B" },
      { id: "AP-3", x: 50, y: 45, channel: 36, txPower: 20, zone: "Ward C" },
      { id: "AP-4", x: 10, y: 12, channel: 44, txPower: 20, zone: "Ward D" },
      { id: "AP-5", x: 30, y: 12, channel: 48, txPower: 20, zone: "Ward E" }, // Fails at 14:00-16:00
      { id: "AP-6", x: 50, y: 12, channel: 149, txPower: 20, zone: "Ward F" },
      { id: "AP-7", x: 66, y: 50, channel: 153, txPower: 20, zone: "Operating Theatre 1" },
      { id: "AP-8", x: 66, y: 30, channel: 153, txPower: 20, zone: "Operating Theatre 2" },
    ];

    const OBSTACLES = [
      { id: "radiology", label: "Radiology (Lead -25dB)", x: 60, y: 0, w: 12, h: 20, loss: 25 },
      { id: "store", label: "Steel Store (-18dB)", x: 60, y: 17, w: 12, h: 5, loss: 18 },
      { id: "kitchen", label: "Kitchen/Laundry (-12dB)", x: 0, y: 0, w: 15, h: 8, loss: 12 },
    ];

    const ZONES_LABEL = [
      { label: "Ward A", x: 10, y: 52 },
      { label: "Ward B", x: 30, y: 52 },
      { label: "Ward C", x: 50, y: 52 },
      { label: "Ward D", x: 10, y: 5 },
      { label: "Ward E", x: 30, y: 5 },
      { label: "Ward F", x: 50, y: 5 },
      { label: "Corridor Spine", x: 35, y: 27 },
      { label: "Lift Bank", x: 76, y: 57 },
      { label: "ICU", x: 76, y: 10 },
      { label: "OR 1 & 2", x: 66, y: 42 },
    ];

    // Seeded crowdsource data generator
    const generateScatterPoints = () => {
      const points = [];
      let id = 1;
      for (let gx = 0; gx < GRID_W; gx += 2) {
        for (let gy = 0; gy < GRID_H; gy += 2) {
          if ((gx * 7 + gy * 13) % 5 === 0) {
            const rx = gx * 2 + 1;
            const ry = gy * 2 + 1;
            points.push({ id: id++, x: rx, y: ry, count: 4 + (id % 12) });
          }
        }
      }
      return points;
    };
    const SCATTER_POINTS = generateScatterPoints();

    // --------------------------------------------------------------------------
    // MAIN APP COMPONENT
    // --------------------------------------------------------------------------
    function App() {
      // Role State: null = Login Screen, 'engineer' = Network Engineer, 'clinical' = Clinical IT Manager
      const [role, setRole] = useState(null);
      const [timeHour, setTimeHour] = useState(10); // 00:00 to 23:00
      const [showScatter, setShowScatter] = useState(true);
      const [selectedAp, setSelectedAp] = useState(null);
      const [hoveredCell, setHoveredCell] = useState(null);
      const [selectedCell, setSelectedCell] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard' | 'config'

      // Config State
      const [config, setConfig] = useState(DEFAULT_CONFIG);
      const [tempConfig, setTempConfig] = useState(DEFAULT_CONFIG);

      // Check AP-5 failure simulation
      const isAp5Offline = timeHour >= 14 && timeHour <= 16;

      // Reset selection when changing roles
      const handleSelectRole = (newRole) => {
        setRole(newRole);
        setActiveTab('dashboard');
      };

      // ITU-R Signal Calculation for grid cell (cx, cy)
      const computeCellSignal = (cx, cy, threshold, offlineAp5) => {
        const mx = (cx + 0.5) * 2; // meters
        const my = (cy + 0.5) * 2; // meters

        let maxRssi = -120;
        let bestAp = null;

        ACCESS_POINTS.forEach(ap => {
          if (ap.id === 'AP-5' && offlineAp5) return; // AP-5 offline

          const dist = Math.sqrt(Math.pow(mx - ap.x, 2) + Math.pow(my - ap.y, 2)) || 0.1;
          // Pathloss: 20 log10(5.0) + 30 log10(d) - 28
          let pathLoss = 20 * Math.log10(5.0) + 30 * Math.log10(dist) - 28;

          // Wall obstacles
          let wallLoss = 0;
          OBSTACLES.forEach(obs => {
            if (mx >= obs.x && mx <= obs.x + obs.w && my >= obs.y && my <= obs.y + obs.h) {
              wallLoss += obs.loss;
            }
          });

          // Noise window adjustment
          let timeNoise = (Math.sin(timeHour / 3.0) * 1.5);

          const rssi = ap.txPower - pathLoss - wallLoss + timeNoise;
          if (rssi > maxRssi) {
            maxRssi = rssi;
            bestAp = ap;
          }
        });

        const isDeadZone = maxRssi < threshold;
        return { rssi: maxRssi, bestAp, isDeadZone };
      };

      // Compute grid map data dynamically based on threshold & AP-5 failure
      const gridMap = useMemo(() => {
        const grid = [];
        let deadZoneCount = 0;

        for (let cy = 0; cy < GRID_H; cy++) {
          const row = [];
          for (let cx = 0; cx < GRID_W; cx++) {
            const cell = computeCellSignal(cx, cy, config.rssiThreshold, isAp5Offline);
            if (cell.isDeadZone) deadZoneCount++;
            row.push(cell);
          }
          grid.push(row);
        }
        return { grid, deadZoneCount };
      }, [config.rssiThreshold, isAp5Offline, timeHour]);

      // Calculate Metrics
      const totalCells = GRID_W * GRID_H; // 1200 downsampled cells
      const deadZoneCount = gridMap.deadZoneCount;
      const deadZonePercentage = ((deadZoneCount / totalCells) * 100).toFixed(1);
      const slaCompliance = (100 - parseFloat(deadZonePercentage)).toFixed(1);
      const activeApCount = isAp5Offline ? 7 : 8;

      // Color mapping function
      const getRssiColor = (rssi, isDeadZone) => {
        if (isDeadZone) return 'rgba(230, 57, 70, 0.75)'; // Red/Amber hazard
        if (rssi >= -65) return '#00B4D8'; // Bright Signal Teal
        if (rssi >= -75) return '#FFB703'; // Warning Yellow
        return '#E63946'; // Red
      };

      // If no role selected, render SCREEN 1: LOGIN & ROLE SELECTOR
      if (!role) {
        return (
          <div className="min-h-screen bg-[#0B1F3A] flex flex-col justify-center items-center px-4">
            <div className="max-w-xl w-full bg-[#0F2747] border border-slate-700/80 p-8 shadow-2xl">
              <div className="flex items-center space-x-3 mb-6">
                <div className="w-10 h-10 bg-teal-500 flex items-center justify-center font-bold text-navy-950 text-xl font-mono">
                  CW
                </div>
                <div>
                  <h1 className="text-2xl font-bold text-white tracking-tight">CWMOS Engine</h1>
                  <p className="text-xs text-slate-400 font-mono">Clinical Wi-Fi Monitoring & Optimization System</p>
                </div>
              </div>

              <p className="text-sm text-slate-300 mb-8 border-l-2 border-teal-500 pl-3">
                Select an organizational role to initialize the telemetry dashboard with role-specific access permissions and threshold rules.
              </p>

              <div className="space-y-4">
                <button
                  onClick={() => handleSelectRole('engineer')}
                  className="w-full text-left p-5 bg-[#143054] hover:bg-[#1E3A5F] border border-teal-500/40 hover:border-teal-400 transition-all group"
                >
                  <div className="flex items-center justify-between mb-2">
                    <span className="font-semibold text-teal-400 text-lg group-hover:translate-x-1 transition-transform">
                      Network Engineer
                    </span>
                    <span className="text-xs font-mono bg-teal-500/20 text-teal-300 px-2 py-1 border border-teal-500/30">
                      FULL READ / WRITE
                    </span>
                  </div>
                  <p className="text-xs text-slate-300 leading-relaxed">
                    Full read/write access to AP channel plans, RSSI thresholds, interference heatmaps, Kalman parameters, and raw crowdsource logs.
                  </p>
                </button>

                <button
                  onClick={() => handleSelectRole('clinical')}
                  className="w-full text-left p-5 bg-[#143054] hover:bg-[#1E3A5F] border border-slate-700 hover:border-slate-500 transition-all group"
                >
                  <div className="flex items-center justify-between mb-2">
                    <span className="font-semibold text-slate-200 text-lg group-hover:translate-x-1 transition-transform">
                      Clinical IT Manager
                    </span>
                    <span className="text-xs font-mono bg-slate-700/60 text-slate-300 px-2 py-1 border border-slate-600">
                      READ-ONLY DASHBOARD
                    </span>
                  </div>
                  <p className="text-xs text-slate-400 leading-relaxed">
                    Read-only executive dashboard showing coverage SLA compliance, dead-zone counts, patient ward metrics, and plain-language action items.
                  </p>
                </button>
              </div>

              <div className="mt-8 pt-4 border-t border-slate-800 text-center text-xs font-mono text-slate-500">
                Phase 4 Prototype • 80m × 60m Grid • Physics-Informed Kalman Engine
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="flex-1 flex flex-col min-h-screen">
          {/* HEADER BAR */}
          <header className="bg-[#0F2747] border-b border-slate-700/80 px-6 py-3.5 flex items-center justify-between sticky top-0 z-30">
            <div className="flex items-center space-x-4">
              <div className="flex items-center space-x-2.5">
                <div className="w-8 h-8 bg-teal-500 text-navy-950 flex items-center justify-center font-bold font-mono text-sm">
                  CW
                </div>
                <div>
                  <h1 className="font-bold text-white text-base tracking-wide flex items-center space-x-2">
                    <span>CWMOS DASHBOARD</span>
                    <span className="text-[10px] font-mono bg-teal-500/20 text-teal-300 border border-teal-500/40 px-1.5 py-0.5">
                      LIVE INFERENCE
                    </span>
                  </h1>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="flex space-x-1 ml-6 border-l border-slate-700 pl-4">
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`px-3 py-1.5 text-xs font-medium transition-colors ${
                    activeTab === 'dashboard'
                      ? 'bg-teal-500/20 text-teal-300 border-b-2 border-teal-400'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  Floor Heatmap
                </button>
                {role === 'engineer' && (
                  <button
                    onClick={() => setActiveTab('config')}
                    className={`px-3 py-1.5 text-xs font-medium transition-colors ${
                      activeTab === 'config'
                        ? 'bg-teal-500/20 text-teal-300 border-b-2 border-teal-400'
                        : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    Rule Config Panel
                  </button>
                )}
                <button
                  onClick={() => setActiveTab('validation')}
                  className={`px-3 py-1.5 text-xs font-medium transition-colors ${
                    activeTab === 'validation'
                      ? 'bg-teal-500/20 text-teal-300 border-b-2 border-teal-400'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  Results & Validation
                </button>
              </nav>
            </div>

            {/* Role Switcher & Controls */}
            <div className="flex items-center space-x-4">
              <div className="flex items-center space-x-2 bg-navy-950 px-3 py-1.5 border border-slate-700">
                <span className="text-xs text-slate-400">Active Role:</span>
                <span className={`text-xs font-bold font-mono ${role === 'engineer' ? 'text-teal-400' : 'text-amber-400'}`}>
                  {role === 'engineer' ? 'Network Engineer' : 'Clinical IT Manager'}
                </span>
                <button
                  onClick={() => setRole(role === 'engineer' ? 'clinical' : 'engineer')}
                  className="text-[10px] underline text-slate-400 hover:text-white ml-2"
                >
                  Switch
                </button>
              </div>

              <button
                onClick={() => setRole(null)}
                className="text-xs text-slate-400 hover:text-white px-2 py-1 border border-slate-700 hover:bg-slate-800"
              >
                Logout
              </button>
            </div>
          </header>

          {/* AP-5 FAILURE STATE BANNER (Triggers at 14:00 - 16:00) */}
          {isAp5Offline && (
            <div className="bg-red-950/90 border-b border-red-600 px-6 py-2.5 flex items-center justify-between text-red-200 animate-pulse">
              <div className="flex items-center space-x-3">
                <span className="w-3 h-3 bg-red-500 rounded-full inline-block animate-ping"></span>
                <span className="font-mono font-bold text-sm tracking-wide text-red-100">
                  CRITICAL FAILURE: AP-5 OFFLINE — 11 cells elevated to dead-zone status
                </span>
                <span className="text-xs text-red-300">
                  (Simulated Hardware Failure Window: 14:00–16:00)
                </span>
              </div>
              <span className="text-xs font-mono bg-red-900 border border-red-700 px-2 py-0.5 text-red-100">
                WARD E COVERAGE DROP
              </span>
            </div>
          )}

          {/* SCREEN 4: SUMMARY METRICS BAR */}
          <section className="bg-[#0B1F3A] border-b border-slate-700/80 px-6 py-3">
            {role === 'engineer' ? (
              /* Network Engineer View */
              <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                <div className="bg-[#0F2747] border border-slate-700 p-3">
                  <div className="text-[11px] font-mono text-slate-400 uppercase tracking-wider">Dead Zone Count</div>
                  <div className="text-xl font-bold font-mono text-hazard-red mt-1 flex items-baseline justify-between">
                    <span>{deadZoneCount} cells</span>
                    <span className="text-xs text-slate-400 font-sans">({deadZonePercentage}%)</span>
                  </div>
                </div>

                <div className="bg-[#0F2747] border border-slate-700 p-3">
                  <div className="text-[11px] font-mono text-slate-400 uppercase tracking-wider">Active AP Status</div>
                  <div className="text-xl font-bold font-mono text-teal-400 mt-1 flex items-baseline justify-between">
                    <span>{activeApCount} / 8</span>
                    <span className={`text-xs font-sans ${isAp5Offline ? 'text-red-400' : 'text-emerald-400'}`}>
                      {isAp5Offline ? 'AP-5 Fault' : 'All Online'}
                    </span>
                  </div>
                </div>

                <div className="bg-[#0F2747] border border-slate-700 p-3">
                  <div className="text-[11px] font-mono text-slate-400 uppercase tracking-wider">Channel Conflicts</div>
                  <div className="text-xl font-bold font-mono text-amber-400 mt-1 flex items-baseline justify-between">
                    <span>2 Conflicts</span>
                    <span className="text-xs font-sans text-slate-400">CH 36, 153</span>
                  </div>
                </div>

                <div className="bg-[#0F2747] border border-slate-700 p-3">
                  <div className="text-[11px] font-mono text-slate-400 uppercase tracking-wider">Sample Coverage</div>
                  <div className="text-xl font-bold font-mono text-teal-300 mt-1 flex items-baseline justify-between">
                    <span>38.5%</span>
                    <span className="text-xs font-sans text-slate-400">1,850 readings</span>
                  </div>
                </div>

                <div className="bg-[#0F2747] border border-slate-700 p-3 col-span-2 md:col-span-1">
                  <div className="text-[11px] font-mono text-slate-400 uppercase tracking-wider">Last Sync Time</div>
                  <div className="text-sm font-mono text-slate-200 mt-2 truncate">
                    {String(timeHour).padStart(2, '0')}:00 UTC • LIVE
                  </div>
                </div>
              </div>
            ) : (
              /* Clinical IT Manager View */
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="bg-[#0F2747] border border-slate-700 p-3.5 flex items-center justify-between">
                  <div>
                    <div className="text-xs font-mono text-slate-400 uppercase">Coverage SLA Compliance</div>
                    <div className="text-2xl font-bold font-mono text-teal-400 mt-0.5">
                      {slaCompliance}%
                    </div>
                  </div>
                  <div className="text-right">
                    <span className="text-xs font-mono bg-emerald-950 text-emerald-300 border border-emerald-700 px-2 py-1">
                      TARGET: &gt; 95.0%
                    </span>
                  </div>
                </div>

                <div className="bg-[#0F2747] border border-slate-700 p-3.5 col-span-1 md:col-span-2 flex items-center justify-between">
                  <div>
                    <div className="text-xs font-mono text-slate-400 uppercase">Clinical Action Status</div>
                    <div className="text-sm font-medium text-slate-200 mt-1 flex items-center space-x-2">
                      <span className="w-2 h-2 rounded-full bg-amber-400 inline-block"></span>
                      <span>
                        {isAp5Offline
                          ? "CRITICAL: AP-5 Failure detected in Ward E. Emergency AP deployment recommended."
                          : "2 dead zones detected near Lift Bank — recommended AP power adjustment pending."}
                      </span>
                    </div>
                  </div>
                  <div className="text-xs font-mono text-slate-400 border-l border-slate-700 pl-4">
                    Verified Today
                  </div>
                </div>
              </div>
            )}
          </section>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 px-6 py-6 space-y-6">
            {activeTab === 'dashboard' && (
              <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                {/* SCREEN 2: FLOOR MAP HEATMAP (HERO ELEMENT) */}
                <div className="lg:col-span-3 bg-[#0F2747] border border-slate-700 p-4 space-y-4 shadow-xl">
                  {/* Heatmap Controls Bar */}
                  <div className="flex flex-wrap items-center justify-between gap-4 bg-[#0B1F3A] p-3 border border-slate-700">
                    {/* Time Slider */}
                    <div className="flex items-center space-x-4 flex-1 min-w-[280px]">
                      <span className="text-xs font-mono text-slate-300 uppercase whitespace-nowrap">
                        Time Window: <strong className="text-teal-400">{String(timeHour).padStart(2, '0')}:00</strong>
                      </span>
                      <input
                        type="range"
                        min="0"
                        max="23"
                        value={timeHour}
                        onChange={(e) => setTimeHour(parseInt(e.target.value))}
                        className="flex-1 accent-teal-400 bg-slate-700 h-1.5 cursor-pointer"
                      />
                      <span className="text-xs font-mono text-slate-400">23:00</span>
                    </div>

                    {/* Toggles & Legend */}
                    <div className="flex items-center space-x-6">
                      <label className="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer">
                        <input
                          type="checkbox"
                          checked={showScatter}
                          onChange={(e) => setShowScatter(e.target.checked)}
                          className="accent-teal-500 rounded-none w-4 h-4"
                        />
                        <span>Scatter Readings</span>
                      </label>

                      {/* RSSI Color Legend */}
                      <div className="flex items-center space-x-3 text-[11px] font-mono">
                        <div className="flex items-center space-x-1">
                          <span className="w-3 h-3 bg-[#00B4D8] inline-block"></span>
                          <span className="text-slate-300">&ge; -65 dBm</span>
                        </div>
                        <div className="flex items-center space-x-1">
                          <span className="w-3 h-3 bg-[#FFB703] inline-block"></span>
                          <span className="text-slate-300">-65..-75</span>
                        </div>
                        <div className="flex items-center space-x-1">
                          <span className="w-3 h-3 bg-[#E63946] inline-block"></span>
                          <span className="text-slate-300">&lt; -75 dBm</span>
                        </div>
                        <div className="flex items-center space-x-1">
                          <span className="w-3 h-3 hatch-pattern border border-red-500 inline-block"></span>
                          <span className="text-amber-300 font-bold">Dead Zone</span>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* SVG FLOOR MAP GRID (80m x 60m downsampled to 40x30 SVG) */}
                  <div className="relative w-full aspect-[80/60] bg-navy-950 border border-slate-700 overflow-hidden select-none">
                    <svg
                      viewBox="0 0 40 30"
                      className="w-full h-full"
                      onMouseLeave={() => setHoveredCell(null)}
                    >
                      {/* 1. Heatmap Cell Rectangles */}
                      {gridMap.grid.map((row, cy) =>
                        row.map((cell, cx) => {
                          const color = getRssiColor(cell.rssi, cell.isDeadZone);

                          return (
                            <g key={`cell-${cx}-${cy}`}>
                              <rect
                                x={cx}
                                y={cy}
